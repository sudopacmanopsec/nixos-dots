bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,v,spawn,rofi -modi clipboard:cliphist -show clipboard
bind=SUPER,b,spawn,firefox
bind=NONE,Print,spawn,mango-screenshot

bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER,space,togglefloating,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER+SHIFT,r,reload_config,
bind=SUPER+SHIFT,e,quit,

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
