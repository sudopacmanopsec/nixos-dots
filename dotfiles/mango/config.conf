# mangowm config (current key names). Reload: SUPER+SHIFT+R
# appearance
borderpx=3
gappih=6
gappiv=6
gappoh=10
gappov=10
rootcolor=0x11111bff
bordercolor=0x45475aff
focuscolor=0x89b4faff
urgentcolor=0xf38ba8ff
border_radius=8
no_radius_when_single=1
focused_opacity=1.0
unfocused_opacity=0.95
shadows=1
shadows_size=12
shadows_blur=15
shadows_color=0x000000aa
blur=0
cursor_size=24
cursor_theme=Adwaita

# input
xkb_rules_layout=gb
repeat_rate=30
repeat_delay=300
tap_to_click=1

# keybinds
source=~/.config/mango/bind.conf

# autostart
exec-once=mango-wallpaper
exec-once=waybar
exec-once=mako
exec-once=wl-paste --watch cliphist store
exec-once=wlsunset -l 51.5 -L -0.1
